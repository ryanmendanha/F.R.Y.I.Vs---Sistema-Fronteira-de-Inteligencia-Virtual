const AD=THREE.AdditiveBlending,DS=THREE.DoubleSide,wrap=document.getElementById('wrap');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x02030a);

const U={t:{value:0},p:{value:0},g:{value:0},pw:{value:1}};

const VS='varying vec2 v,u;void main(){v=position.xy;u=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}';
const GY='uniform float pw;vec3 gy(vec3 c){return mix(vec3(dot(c,vec3(.3,.59,.11))*.8+.03),c,pw);}';

function rr(w,h,r){const x=-w/2,y=-h/2,s=new THREE.Shape();

 s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);return s;}
const PFS=`varying vec2 v,u;uniform float t,p,g;uniform vec2 sz;uniform vec3 c1,c2;

void main(){float sx=v.x/sz.x+.5,sy=v.y/sz.y+.5;float rv=smoothstep(0.,.1,p*1.3-sx);
 vec3 c=mix(c1,c2,sy)*.55;float gr=max(step(.96,fract(v.x*2.)),step(.92,fract(v.y*2.)));
