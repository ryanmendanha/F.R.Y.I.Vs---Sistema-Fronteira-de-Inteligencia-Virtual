canvas{display:block;position:fixed;inset:0;touch-action:none}

.bt{display:flex;gap:4px}

.lb,.bb{position:fixed;left:0;top:0;translate:-50% -100%;font-size:11px;background:rgba(15,20,32,.88);border:1px solid #2a3350;border-radius:999px;padding:2px 8px;white-space:nowrap;pointer-events:none}
.bb{background:#fff;color:#111;border-radius:10px;font-size:12px;display:none!important}.bb.s{display:block!important}
body:not(.in) .bb{display:none!important}
.lb i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}
@media(max-width:700px){.card{width:calc(33% - 6px);padding:6px}.card p{display:none}button{padding:4px 2px;font-size:10px}}
#lock{position:fixed;inset:0;z-index:20;background:radial-gradient(circle at 50% 35%,#1f2a4d,#080b14);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
#lock.go{opacity:0;transform:scale(3);pointer-events:none}
.frame{width:230px;height:350px;border:10px solid #3a2f24;border-bottom:0;border-radius:6px 6px 0 0;background:radial-gradient(circle,#fffbe6,#ffc94d);position:relative;perspective:800px;box-shadow:0 0 50px rgba(255,200,90,.15)}
.door{position:absolute;inset:0;background:linear-gradient(90deg,#6b4a2f,#52391f);transform-origin:left center;border:2px solid #2d2015;display:flex;flex-direction:column;align-items:center;justify-content:flex-start}
.door.open{transform:rotateY(-105deg)}
.door span{margin-top:18px;font-size:10px;letter-spacing:2px;color:#e8d3a8;border:1px solid #a98d5c;padding:4px 8px;text-align:center;line-height:1.5}
.door:after{content:"";position:absolute;left:14px;bottom:24px;width:14px;height:14px;border-radius:50%;background:#e5b94b}
#box{display:flex;flex-direction:column;align-items:center;gap:6px;margin-top:14px;background:#10151f;border:2px solid #5b6478;border-radius:10px;padding:8px 10px;box-shadow:inset 0 0 8px #000,0 3px 8px rgba(0,0,0,.5)}
#pw{width:120px;text-align:center;letter-spacing:6px;font-size:16px;background:#0e2a1f;color:#4ade80;border:1px solid #1f5a40;border-radius:4px;padding:4px;font-family:monospace;outline:0}
#kp{display:grid;grid-template-columns:repeat(3,38px);gap:5px}#kp button{padding:6px 0;font-size:14px}#led{width:8px;height:8px;border-radius:50%;background:#ef4444;box-shadow:0 0 6px #ef4444;display:block;align-self:flex-end}
#msg{font-size:13px;height:16px;color:var(--mut)}
@keyframes sh{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
#box.sh{animation:sh .35s}
</style></head><body>
