# =============================================================================
# F.R.Y.I.Vs — Stack Corporativa n8n Local (Queue Mode + MCP Pinned)
# =============================================================================
# Arquitetura (Camada 4 do Plano de Super Evolução):
#   - n8n-main   : Instância principal única em loopback 127.0.0.1:5678.
#                  TODAS as rotas `/mcp*` (Streamable HTTP / SSE) e Webhooks
#                  ficam pinadas nesta instância para manter sessões SSE estáveis.
#   - n8n-worker : Worker dedicado em Queue Mode (Bull/Redis) sem portas expostas.
#   - postgres   : PostgreSQL 16 Alpine (persistência transacional e credenciais).
#   - redis      : Redis 7 Alpine (fila de execuções n8n + barramento assíncrono).
#
# Variáveis obrigatórias no arquivo `.env` (NUNCA versionar segredos reais):
#   POSTGRES_USER=n8n
#   POSTGRES_DB=n8n
#   POSTGRES_PASSWORD=<gere-uma-senha-forte-32-chars>
#   REDIS_PASSWORD=<gere-uma-senha-forte-32-chars>
#   N8N_ENCRYPTION_KEY=<gere-hex-64-chars-openssl-rand-hex-32>
#   N8N_HMAC_SECRET=<gere-segredo-compartilhado-com-FRYIVS>
#
# Variáveis opcionais:
#   N8N_PORT=5678
#   N8N_HOST=127.0.0.1
#   N8N_PROTOCOL=http
#   N8N_WEBHOOK_BASE_URL=http://127.0.0.1:5678/
#   N8N_WORKER_CONCURRENCY=5
#   GENERIC_TIMEZONE=America/Sao_Paulo
#   FRYIVS_CALLBACK_URL=http://host.docker.internal:8000/api/n8n/callback
#
# Uso:
#   docker compose -f infra/docker-compose.n8n.yml --env-file .env up -d
#   curl http://127.0.0.1:5678/healthz
# =============================================================================

x-n8n-common: &n8n-common
  image: n8nio/n8n:latest
  restart: unless-stopped
  networks:
    - fryivs_n8n_internal
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment: &n8n-env
    # Banco de Dados (PostgreSQL 16)
    DB_TYPE: postgresdb
    DB_POSTGRESDB_HOST: postgres
    DB_POSTGRESDB_PORT: 5432
    DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-n8n}
    DB_POSTGRESDB_USER: ${POSTGRES_USER:-n8n}
    DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}

    # Queue Mode (Bull + Redis 7)
    EXECUTIONS_MODE: queue
    QUEUE_BULL_REDIS_HOST: redis
    QUEUE_BULL_REDIS_PORT: 6379
    QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD:?Defina REDIS_PASSWORD no .env}
    QUEUE_HEALTH_CHECK_ACTIVE: "true"
    OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"

    # Criptografia, Segurança e Isolamento
    N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Defina N8N_ENCRYPTION_KEY no .env}
    N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    N8N_RUNNERS_ENABLED: "true"
    N8N_DIAGNOSTICS_ENABLED: "false"
    N8N_PERSONALIZATION_ENABLED: "false"
    N8N_VERSION_NOTIFICATIONS_ENABLED: "false"

    # Rede, Fuso Horário e Ponte F.R.Y.I.Vs (HMAC-SHA256)
    N8N_HOST: ${N8N_HOST:-127.0.0.1}
    N8N_PORT: 5678
    N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
    WEBHOOK_URL: ${N8N_WEBHOOK_BASE_URL:-http://127.0.0.1:5678/}
    GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Sao_Paulo}
    TZ: ${GENERIC_TIMEZONE:-America/Sao_Paulo}
    N8N_HMAC_SECRET: ${N8N_HMAC_SECRET:?Defina N8N_HMAC_SECRET no .env}
    FRYIVS_CALLBACK_URL: ${FRYIVS_CALLBACK_URL:-http://host.docker.internal:8000/api/n8n/callback}
    NODE_FUNCTION_ALLOW_BUILTIN: crypto

services:
  postgres:
    image: postgres:16-alpine
    container_name: fryivs-n8n-postgres
    restart: unless-stopped
    networks:
      - fryivs_n8n_internal
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-n8n}
      POSTGRES_DB: ${POSTGRES_DB:-n8n}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env}
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-n8n} -d ${POSTGRES_DB:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    container_name: fryivs-n8n-redis
    restart: unless-stopped
    networks:
      - fryivs_n8n_internal
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
      - --requirepass
      - ${REDIS_PASSWORD:?Defina REDIS_PASSWORD no .env}
    volumes:
      - n8n_redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"${REDIS_PASSWORD}\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  n8n-main:
    <<: *n8n-common
    container_name: fryivs-n8n-main
    # PINADO EXCLUSIVAMENTE EM LOOPBACK: UI, Webhooks e rotas `/mcp*` (Streamable HTTP/SSE)
    # permanecem nesta única instância principal sem balanceamento para workers.
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_main_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  n8n-worker:
    <<: *n8n-common
    container_name: fryivs-n8n-worker
    command: worker --concurrency=${N8N_WORKER_CONCURRENCY:-5}
    volumes:
      - n8n_worker_data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n-main:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

networks:
  fryivs_n8n_internal:
    driver: bridge
    name: fryivs_n8n_internal

volumes:
  n8n_postgres_data:
  n8n_redis_data:
  n8n_main_data:
  n8n_worker_data:
