[pytest]
addopts = -p no:cacheprovider
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
filterwarnings =
    ignore::starlette.exceptions.StarletteDeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning
    ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning:chromadb.*
    ignore:'asyncio.iscoroutinefunction' is deprecated and slated for removal:DeprecationWarning
